version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: Sarasvi_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: Sarasvi
      POSTGRES_PASSWORD: Sarasvi_dev_2024
      POSTGRES_DB: Sarasvi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U Sarasvi" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
